<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rezept-Scanner</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 1.5rem 1rem calc(5.5rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .view { display: none; flex-direction: column; gap: 1.25rem; }
    .view.active { display: flex; }

    h1 { font-size: 1.6rem; margin: 0.5rem 0 0; text-align: center; }
    .sub { text-align: center; opacity: 0.65; margin: 0; font-size: 0.9rem; }

    #scanBtn {
      padding: 0.9rem 1.5rem;
      font-size: 1.05rem;
      border: none;
      border-radius: 999px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
    }
    #scanBtn:active { opacity: 0.85; }

    #status {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
      min-height: 1.2em;
    }

    #preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
    }

    .card {
      background: #fdf6e3;
      color: #2d2a24;
      border-radius: 16px;
      padding: 1.5rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      font-family: Georgia, "Times New Roman", serif;
    }
    .card h2 {
      margin: 0 0 0.25rem;
      font-size: 1.4rem;
      border-bottom: 2px solid #d9c9a3;
      padding-bottom: 0.5rem;
    }
    .card .meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      opacity: 0.75;
      margin: 0.5rem 0 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card h3 {
      font-size: 1rem;
      margin: 1rem 0 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card ul, .card ol { margin: 0; padding-left: 1.2rem; }
    .card li { margin-bottom: 0.4rem; line-height: 1.4; }

    .cardActions {
      display: flex;
      gap: 0.75rem;
    }
    .cardActions button {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
    }
    #saveBtn { background: #22c55e; color: #052e12; }
    #discardBtn { background: rgba(255,255,255,0.12); color: #f8fafc; }

    #collectionView h2 { font-size: 1.3rem; margin: 0.5rem 0 0; text-align: center; }
    #collectionList { display: flex; flex-direction: column; gap: 0.75rem; }
    .collectionItem {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .collectionItem .title { font-weight: 600; }
    .collectionItem .meta2 { font-size: 0.8rem; opacity: 0.6; }
    .collectionItem button {
      border: none;
      background: transparent;
      color: #f87171;
      font-size: 1.1rem;
      padding: 0.3rem 0.5rem;
    }
    .collectionItem .open { color: #38bdf8; background: transparent; border: none; font-size: 0.85rem; font-weight: 600; }

    #emptyHint { text-align: center; opacity: 0.5; font-size: 0.85rem; }

    #detailView { display: none; flex-direction: column; gap: 1.25rem; }
    #detailView.active { display: flex; }
    #backBtn {
      align-self: flex-start;
      border: none;
      background: transparent;
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.4rem 0;
    }

    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar button {
      flex: 1;
      border: none;
      background: transparent;
      color: rgba(248,250,252,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      padding: 0.6rem 0 0.5rem;
      font-size: 0.72rem;
      font-family: inherit;
    }
    .tabbar button .icon { font-size: 1.3rem; }
    .tabbar button.active { color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <section id="scanView" class="view active">
      <h1>📷 Rezept-Scanner</h1>
      <p class="sub">Kochbuchseite fotografieren, automatisch als Kärtchen speichern.</p>

      <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none" />
      <button id="scanBtn">Rezept fotografieren</button>
      <p id="status"></p>
      <img id="preview" alt="Aufgenommenes Foto" />

      <div id="result"></div>
    </section>

    <section id="collectionView" class="view">
      <h2>Meine Sammlung</h2>
      <div id="collectionList"></div>
      <p id="emptyHint">Noch keine Rezepte gespeichert.</p>
    </section>

    <section id="detailView">
      <button id="backBtn">← Zurück zur Sammlung</button>
      <div id="detailResult"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button id="tabScan" class="active" data-view="scanView">
      <span class="icon">📷</span>
      <span>Scannen</span>
    </button>
    <button id="tabCollection" data-view="collectionView">
      <span class="icon">📚</span>
      <span>Sammlung</span>
    </button>
  </nav>

  <script>
    const fileInput = document.getElementById("fileInput");
    const scanBtn = document.getElementById("scanBtn");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");
    const resultEl = document.getElementById("result");
    const collectionList = document.getElementById("collectionList");
    const emptyHint = document.getElementById("emptyHint");
    const detailView = document.getElementById("detailView");
    const detailResult = document.getElementById("detailResult");
    const backBtn = document.getElementById("backBtn");

    const views = {
      scanView: document.getElementById("scanView"),
      collectionView: document.getElementById("collectionView"),
    };
    const tabs = [document.getElementById("tabScan"), document.getElementById("tabCollection")];

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => showView(tab.dataset.view));
    });
    backBtn.addEventListener("click", () => showView("collectionView"));

    function showView(name) {
      detailView.classList.remove("active");
      Object.entries(views).forEach(([key, el]) => {
        el.classList.toggle("active", key === name);
      });
      tabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.view === name));
    }

    function showDetail(recipe) {
      Object.values(views).forEach((el) => el.classList.remove("active"));
      tabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.view === "collectionView"));
      detailView.classList.add("active");
      renderCard(recipe, false, detailResult);
    }

    const STORAGE_KEY = "recipeCollection";
    let currentRecipe = null;

    scanBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", onFileSelected);

    async function onFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      resultEl.innerHTML = "";
      statusEl.textContent = "Foto wird verkleinert…";

      try {
        const { base64, mediaType, dataUrl } = await resizeImage(file, 1600, 0.82);
        preview.src = dataUrl;
        preview.style.display = "block";

        statusEl.textContent = "Rezept wird gelesen… (kann ein paar Sekunden dauern)";

        const res = await fetch("/.netlify/functions/extract-recipe", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ image: base64, mediaType }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Unbekannter Fehler");
        }

        currentRecipe = data;
        statusEl.textContent = "";
        renderCard(data, true, resultEl);
      } catch (err) {
        statusEl.textContent = "Fehler: " + err.message;
      } finally {
        fileInput.value = "";
      }
    }

    function resizeImage(file, maxDim, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve({ base64: dataUrl.split(",")[1], mediaType: "image/jpeg", dataUrl });
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderCard(recipe, withActions, target) {
      const ingredients = (recipe.ingredients || []).map((i) => `<li>${escapeHtml(i)}</li>`).join("");
      const steps = (recipe.instructions || []).map((s) => `<li>${escapeHtml(s)}</li>`).join("");
      const meta = [recipe.servings, recipe.time].filter(Boolean).map(escapeHtml).join(" · ");

      target.innerHTML = `
        <div class="card">
          <h2>${escapeHtml(recipe.title || "Ohne Titel")}</h2>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
          ${ingredients ? `<h3>Zutaten</h3><ul>${ingredients}</ul>` : ""}
          ${steps ? `<h3>Zubereitung</h3><ol>${steps}</ol>` : ""}
        </div>
        ${withActions ? `
          <div class="cardActions">
            <button id="saveBtn">Speichern</button>
            <button id="discardBtn">Verwerfen</button>
          </div>` : ""}
      `;

      if (withActions) {
        document.getElementById("saveBtn").addEventListener("click", saveCurrentRecipe);
        document.getElementById("discardBtn").addEventListener("click", () => {
          resultEl.innerHTML = "";
          preview.style.display = "none";
          currentRecipe = null;
        });
      }
    }

    function saveCurrentRecipe() {
      if (!currentRecipe) return;
      const list = loadCollection();
      list.unshift({ ...currentRecipe, savedAt: new Date().toISOString() });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      resultEl.innerHTML = "";
      preview.style.display = "none";
      currentRecipe = null;
      renderCollection();
      showView("collectionView");
    }

    function loadCollection() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function renderCollection() {
      const list = loadCollection();
      emptyHint.style.display = list.length ? "none" : "block";
      collectionList.innerHTML = list.map((r, i) => `
        <div class="collectionItem">
          <div>
            <div class="title">${escapeHtml(r.title || "Ohne Titel")}</div>
            <div class="meta2">${[r.servings, r.time].filter(Boolean).map(escapeHtml).join(" · ")}</div>
          </div>
          <button class="open" data-index="${i}">Öffnen</button>
          <button data-delete="${i}" aria-label="Löschen">✕</button>
        </div>
      `).join("");

      collectionList.querySelectorAll("[data-index]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const r = loadCollection()[Number(btn.dataset.index)];
          showDetail(r);
        });
      });
      collectionList.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const list = loadCollection();
          list.splice(Number(btn.dataset.delete), 1);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          renderCollection();
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    renderCollection();
  </script>
</body>
</html>
