            </div>`).join("")}</div>
          <button class="addDashed" data-action="addDraftIngredient">+ Zutat hinzufügen</button>

          <div class="h3">Zubereitung</div>
          <div class="ingredientsList">${draft.steps.map((val, i) => `
            <div class="listRow" style="align-items:flex-start;">
              <div class="stepNum">${i + 1}</div>
              <textarea data-bind-live="draft.steps.${i}">${escapeHtml(val)}</textarea>
              <button class="removeBtn" style="margin-top:0.35rem;" data-action="removeDraftStep" data-index="${i}">×</button>
            </div>`).join("")}</div>
          <button class="addDashed" data-action="addDraftStep">+ Schritt hinzufügen</button>

          <div class="h3">Notizen</div>
          <textarea class="notesArea" data-bind-live="__notes">${escapeHtml(r.notes || "")}</textarea>

          <div class="h3">Sammlung</div>
          <div class="chipRow">${[{ id: null, name: "Keine Sammlung" }, ...data.notebooks].map((n) =>
            `<button class="chip ${n.id === draft.notebookId ? "chipActive" : "chipInactiveAlt"}" data-action="setDraftNotebook" data-id="${n.id ?? ""}">${escapeHtml(n.name)}</button>`
          ).join("")}</div>

          <div class="formFooter" style="padding:1.4rem 0 0;">
            <button class="btnGhost" data-action="cancelEdit">Abbrechen</button>
            <button class="btnPrimary" data-action="saveEdit">Fertig</button>
          </div>
          <button class="deleteLink" data-action="requestDeleteRecipe">Rezept löschen</button>
        `;
      }

      html += `</div></div>`;
      return html;
    }

    // ---------- Delete confirm ----------
    function renderDeleteConfirm() {
      const label = state.pendingDeletion ? state.pendingDeletion.label : "";
      return `
        <div class="confirmBackdrop">
          <div class="confirmBox">
            <div class="confirmTitle">${escapeHtml(label)} wirklich löschen?</div>
            <div class="confirmText">Dieser Schritt kann nicht rückgängig gemacht werden.</div>
            <div class="confirmRow">
              <button class="btnGhost" data-action="cancelPendingDeletion">Abbrechen</button>
              <button class="btnDanger" data-action="confirmPendingDeletion">Löschen</button>
            </div>
          </div>
        </div>`;
    }

    // ---------- Cook mode ----------
    function renderCookMode() {
      const r = getRecipe(state.cookMode.recipeId);
      if (!r) return "";
      const idx = state.cookMode.stepIndex;
      const steps = r.steps || [];
      const isLast = idx >= steps.length - 1;
      return `
        <div class="cookScreen">
          <div class="cookHeader">
            <div class="cookTitle">${escapeHtml(r.title)}</div>
            <button class="roundBtn" style="background:rgba(255,255,255,0.12);" data-action="closeCookMode"><svg width="12" height="12" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          </div>
          <div class="cookBody">
            <div class="cookStepLabel">Schritt ${idx + 1} von ${steps.length}</div>
            <div class="cookStepText">${escapeHtml(steps[idx] || "")}</div>
          </div>
          <div class="cookFooter">
            ${idx > 0 ? `<button class="cookBtn" data-action="cookPrev">Zurück</button>` : ""}
            <button class="cookBtn cookBtnNext" data-action="cookNext">${isLast ? "Fertig" : "Weiter"}</button>
          </div>
        </div>`;
    }

    // ---------- Capture ----------
    function renderCapture() {
      if (state.captureStep === "processing") {
        return `
          <div class="captureScreen">
            <div class="spinner"></div>
            <div class="captureText">Dein Rezept wird erstellt …</div>
            <div class="captureSub">Zutaten und Schritte werden erkannt</div>
          </div>`;
      }
      if (state.captureStep === "error") {
        return `
          <div class="captureScreen">
            <div class="captureText captureErr">Fehler beim Auslesen</div>
            <div class="captureSub">${escapeHtml(state.captureError)}</div>
            <button class="btnPrimary" style="flex:none;padding:0.7rem 1.4rem;" data-action="discardCapture">Schließen</button>
          </div>`;
      }
      if (state.captureStep === "dishPrompt") {
        return `
          <div class="fullSheetBackdrop"></div>
          <div class="fullSheet" style="align-items:center;justify-content:center;text-align:center;padding:2rem;">
            <div style="font-size:1.25rem;font-weight:700;color:var(--text);">Rezept gespeichert!</div>
            <div style="font-size:0.9rem;color:var(--text-2);margin-top:0.6rem;max-width:260px;">Möchtest du direkt ein Foto vom fertigen Gericht machen? Das wird dann als Rezeptfoto verwendet.</div>
            <button class="btnPrimary" style="flex:none;padding:0.85rem 1.8rem;margin-top:1.6rem;" data-action="startDishCapture">Foto aufnehmen</button>
            <button class="chooserCancel" style="margin-top:0.3rem;" data-action="finishCaptureFlow">Überspringen</button>
          </div>`;
      }
      // result
      const p = state.pendingRecipe;
      return `
        <div class="fullSheetBackdrop"></div>
        <div class="fullSheet">
          <div class="sheetHeader">
            <button class="roundBtn" data-action="discardCapture"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <div class="sheetHeaderTitle">Neues Rezept</div>
            <div style="width:36px;"></div>
          </div>
          <div class="formScroll">
            <span class="badge" style="background:var(--accent-soft);color:var(--accent-text);">✓ Automatisch erkannt</span>
            <div class="photoPh" style="height:170px;border-radius:16px;margin-top:0.9rem;${state.pendingThumb ? `background-image:url('${state.pendingThumb}');` : ""}"></div>
            <div class="detailTitle" style="margin-top:0.9rem;">${escapeHtml(p.title || "Ohne Titel")}</div>
            <div class="detailMeta">${[p.servings, p.time].filter(Boolean).map(escapeHtml).join(" · ")}</div>
            <div class="h3">Zutaten</div>
            <div class="ingredientsList">${(p.ingredients || []).map((ing) => `<div class="ingredientRow"><div class="dot"></div><div style="font-size:0.9rem;">${escapeHtml(ing)}</div></div>`).join("")}</div>
            <div class="h3">Zubereitung</div>
            <div class="stepsList">${(p.instructions || []).map((s, i) => `<div class="stepItem"><div class="stepNum" style="margin-top:0;">${i + 1}</div><div class="stepText">${escapeHtml(s)}</div></div>`).join("")}</div>
          </div>
          <div class="formFooter">
            <button class="btnGhost" data-action="discardCapture">Verwerfen</button>
            <button class="btnPrimary" data-action="saveCapture">Speichern</button>
          </div>
        </div>`;
    }

    // ---------- Photo crop ----------
    function renderCrop() {
      const c = state.cropStep;
      const w = c.naturalWidth * c.baseScale * c.zoom;
      const h = c.naturalHeight * c.baseScale * c.zoom;
      return `
        <div class="cropScreen">
          <div class="captureText">Foto zuschneiden</div>
          <div class="cropFrame" id="cropFrame">
            <img src="${c.fileUrl}" draggable="false" style="width:${w}px;height:${h}px;transform:translate(${c.offsetX}px, ${c.offsetY}px);" />
          </div>
          <div class="cropControls">
            <svg width="14" height="14" viewBox="0 0 16 16" style="flex-shrink:0;color:rgba(255,255,255,0.55);"><path d="M8 1v14M1 8h14" fill="none" stroke="currentColor" stroke-width="0" /><circle cx="8" cy="8" r="3" fill="currentColor" opacity="0.5"/></svg>
            <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="${c.zoom}" />
            <svg width="20" height="20" viewBox="0 0 16 16" style="flex-shrink:0;color:rgba(255,255,255,0.9);"><circle cx="8" cy="8" r="6" fill="currentColor" opacity="0.5"/></svg>
          </div>
          <div class="cropFooter">
            <button class="cookBtn" data-action="cancelCrop">Abbrechen</button>
            <button class="cookBtn cookBtnNext" data-action="confirmCrop">Übernehmen</button>
          </div>
        </div>`;
    }

    // ---------- Event binding ----------
    function getPath(obj, path) {
      return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
    }
    function setPath(obj, path, value) {
      const parts = path.split(".");
      const last = parts.pop();
      const target = parts.reduce((o, k) => o[k], obj);
      target[last] = value;
    }

    function bindEvents() {
      app.querySelectorAll("[data-action]").forEach((el) => {
        const action = el.dataset.action;
        if (!ACTIONS[action]) return;
        const evt = el.tagName === "INPUT" || el.tagName === "TEXTAREA" ? "click" : "click";
        el.addEventListener(evt, (e) => {
          if (el.dataset.stop) e.stopPropagation();
          else if (el.closest("[data-stop]") && el !== el.closest("[data-stop]")) {} // noop
          ACTIONS[action](el, e);
        });
      });
      // backdrop stop-propagation for sheet content
      app.querySelectorAll("[data-stop]").forEach((el) => {
        el.addEventListener("click", (e) => e.stopPropagation());
      });

      // live text bindings. Most fields only need their value captured for later save
      // (no re-render, so typing never loses focus). The search field is the exception —
      // the visible list depends on it changing live, so it re-renders with focus/cursor preserved.
      app.querySelectorAll("[data-bind-live]").forEach((el) => {
        el.addEventListener("input", () => {
          const path = el.dataset.bindLive;
          if (path === "__notes") {
            const r = getRecipe(state.selectedId);
            if (r) {
              r.notes = el.value;
              clearTimeout(notesSaveTimer);
              notesSaveTimer = setTimeout(() => saveRecipeRemote(r), 700);
            }
            autoResizeTextarea(el);
            return;
          }
          if (path.startsWith("__quicknote:")) {
            const noteId = path.slice("__quicknote:".length);
            const note = data.notes.find((n) => n.id === noteId);
            if (note) {
              note.title = el.value;
              clearTimeout(quickNoteSaveTimers[noteId]);
              quickNoteSaveTimers[noteId] = setTimeout(() => saveQuickNoteRemote(note), 700);
            }
            return;
          }
          setPath(state, path, el.value);
          if (path === "search") rerenderPreservingFocus(el);
        });
      });
      app.querySelectorAll("[data-bind]").forEach((el) => {
        el.addEventListener("input", () => { state[el.dataset.bind] = el.value; });
      });

      // notes textarea grows to fit its content instead of scrolling
      app.querySelectorAll(".notesArea").forEach(autoResizeTextarea);

      // photo crop: drag to pan, slider to zoom (direct style mutation, no re-render, for smoothness)
      const cropFrame = app.querySelector("#cropFrame");
      if (cropFrame) {
        const cropImg = cropFrame.querySelector("img");
        cropFrame.addEventListener("pointerdown", (e) => {
          const c = state.cropStep;
          const startX = e.clientX, startY = e.clientY;
          const startOffsetX = c.offsetX, startOffsetY = c.offsetY;
          const onMove = (ev) => {
            c.offsetX = startOffsetX + (ev.clientX - startX);
            c.offsetY = startOffsetY + (ev.clientY - startY);
            clampCropOffset(c);
            cropImg.style.transform = `translate(${c.offsetX}px, ${c.offsetY}px)`;
          };
          const onUp = () => {
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
          };
          document.addEventListener("pointermove", onMove);
          document.addEventListener("pointerup", onUp);
        });
      }
      const cropZoom = app.querySelector("#cropZoom");
      if (cropZoom) {
        cropZoom.addEventListener("input", () => {
          const c = state.cropStep;
          c.zoom = parseFloat(cropZoom.value);
          clampCropOffset(c);
          const w = c.naturalWidth * c.baseScale * c.zoom;
          const h = c.naturalHeight * c.baseScale * c.zoom;
          const img = app.querySelector("#cropFrame img");
          img.style.width = w + "px";
          img.style.height = h + "px";
          img.style.transform = `translate(${c.offsetX}px, ${c.offsetY}px)`;
        });
      }

      // drag handles to reorder ingredients while editing a recipe
      bindDragReorder("#draftIngredientsList", () => state.draft.ingredients);

      // drag handles to reorder categories/notebooks/tags/people in the Verwalten tab
      bindDragReorder("#manage_categories_list", () => data.categories, () => persistOrder("categories"));
      bindDragReorder("#manage_notebooks_list", () => data.notebooks, () => persistOrder("notebooks"));
      bindDragReorder("#manage_tags_list", () => data.tags, () => persistOrder("tags"));
      bindDragReorder("#manage_people_list", () => data.people, () => persistOrder("people"));
    }

    function bindDragReorder(containerSelector, getArray, onDropPersist) {
      const list = app.querySelector(containerSelector);
      if (!list) return;
      list.querySelectorAll(".dragHandle").forEach((handle) => {
        handle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          let index = Number(handle.closest(".listRow").dataset.dragIndex);
          let moved = false;
          const onMove = (ev) => {
            const container = app.querySelector(containerSelector);
            if (!container) return;
            for (const row of container.querySelectorAll(".listRow")) {
              const over = Number(row.dataset.dragIndex);
              if (over === index) continue;
              const rect = row.getBoundingClientRect();
              if (ev.clientY > rect.top && ev.clientY < rect.bottom) {
                const arr = getArray();
                const [item] = arr.splice(index, 1);
                arr.splice(over, 0, item);
                index = over;
                moved = true;
                render();
                break;
              }
            }
          };
          const onUp = () => {
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
            if (moved && onDropPersist) onDropPersist();
          };
          document.addEventListener("pointermove", onMove);
          document.addEventListener("pointerup", onUp);
        });
      });
    }

    function autoResizeTextarea(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    // ---------- Actions ----------
    const ACTIONS = {
      goHome: () => { state.tab = "home"; render(); },
      goNotes: () => { state.tab = "notes"; render(); },
      goCollection: () => { state.tab = "collection"; render(); },
      goManage: () => { state.tab = "manage"; render(); },
      startRename: (el) => {
        const list = el.dataset.list;
        const key = el.dataset.key;
        state.renaming = { list, key };
        state.renameValue = list === "notebooks" ? (notebookName(key) || "") : key;
        render();
      },
      cancelRename: () => { state.renaming = null; state.renameValue = ""; render(); },
      confirmRename: () => {
        const r = state.renaming;
        state.renaming = null;
        const newName = state.renameValue.trim();
        if (r && newName) {
          if (r.list === "categories") renameCategoryValue(r.key, newName);
          else if (r.list === "tags") renameTagValue(r.key, newName);
          else if (r.list === "people") renamePersonValue(r.key, newName);
          else if (r.list === "notebooks") renameNotebookValue(r.key, newName);
        }
        state.renameValue = "";
        render();
      },
      addQuickNote: () => {
        const note = { id: uid(), title: "", createdAt: Date.now() };
        data.notes.unshift(note);
        saveQuickNoteRemote(note);
        render();
        const firstInput = app.querySelector("#quickNotesList input");
        if (firstInput) firstInput.focus();
      },
      removeQuickNote: (el) => {
        const id = el.dataset.id;
        data.notes = data.notes.filter((n) => n.id !== id);
        deleteQuickNoteRemote(id);
        render();
      },
      toggleRecentOpen: () => { state.recentOpen = !state.recentOpen; render(); },
      toggleFavoritesOpen: () => { state.favoritesOpen = !state.favoritesOpen; render(); },
      selectCategoryHome: (el) => { state.categoryFilter = el.dataset.name; state.notebookFilter = "all"; state.filterGroup = "category"; state.tab = "collection"; render(); },
      selectNotebookHome: (el) => { state.notebookFilter = el.dataset.id; state.categoryFilter = "Alle"; state.filterGroup = "notebook"; state.tab = "collection"; render(); },
      addCategory: () => {
        const name = state.newCategoryName.trim();
        if (!name) return;
        if (!data.categories.includes(name)) { data.categories.push(name); addCategoryRemote(name); persistOrder("categories"); }
        state.newCategoryName = "";
        render();
      },
      addNotebook: () => {
        const name = state.newNotebookName.trim();
        if (!name) return;
        const id = uid();
        data.notebooks.push({ id, name });
        addNotebookRemote(id, name);
        persistOrder("notebooks");
        state.newNotebookName = "";
        render();
      },
      setFilterGroup: (el) => {
        const name = el.dataset.name;
        state.filterMenuOpen = state.filterGroup === name ? !state.filterMenuOpen : true;
        state.filterGroup = name;
        render();
      },
      setCategoryFilter: (el) => { state.categoryFilter = el.dataset.name; state.filterMenuOpen = false; render(); },
      setNotebookFilter: (el) => { state.notebookFilter = el.dataset.id === "all" ? "all" : el.dataset.id; state.filterMenuOpen = false; render(); },
      setTagFilter: (el) => { state.tagFilter = el.dataset.name; state.filterMenuOpen = false; render(); },
      setTimeFilter: (el) => { state.timeFilter = el.dataset.name; state.filterMenuOpen = false; render(); },
      setPersonFilter: (el) => { state.personFilter = el.dataset.name; state.filterMenuOpen = false; render(); },
      setHealthyFilter: (el) => { state.healthyFilter = el.dataset.name; state.filterMenuOpen = false; render(); },
      setCookedFilter: (el) => { state.cookedFilter = el.dataset.name; state.filterMenuOpen = false; render(); },
      toggleCooked: () => {
        const r = getRecipe(state.selectedId);
        if (!r) return;
        r.cooked = !r.cooked;
        setCookedRemote(r.id, r.cooked);
        render();
      },
      setLibraryStage: (el) => { state.libraryStage = el.dataset.name; render(); },
      moveRecipeStage: () => {
        const r = getRecipe(state.selectedId);
        if (!r) return;
        r.stage = r.stage === "final" ? "gesammelt" : "final";
        setRecipeStageRemote(r.id, r.stage);
        render();
      },
      requestDeleteCategory: (el) => {
        const name = el.dataset.name;
        state.pendingDeletion = { type: "category", name, label: `Kategorie "${name}"` };
        render();
      },
      requestDeleteNotebook: (el) => {
        const id = el.dataset.id;
        const nb = data.notebooks.find((n) => n.id === id);
        state.pendingDeletion = { type: "notebook", id, label: `Sammlung "${nb ? nb.name : ""}"` };
        render();
      },
      requestDeleteTag: (el) => {
        const name = el.dataset.name;
        state.pendingDeletion = { type: "tag", name, label: `Tag "${name}"` };
        render();
      },
      requestDeletePerson: (el) => {
        const name = el.dataset.name;
        state.pendingDeletion = { type: "person", name, label: `Person "${name}"` };
        render();
      },
      addGlobalTag: () => {
        const v = state.newTagValue.trim();
        if (!v) return;
        if (!data.tags.includes(v)) { data.tags.push(v); addTagRemote(v); persistOrder("tags"); }
        state.newTagValue = "";
        render();
      },
      addPerson: () => {
        const v = state.newPersonName.trim();
        if (!v) return;
        if (!data.people.includes(v)) { data.people.push(v); addPersonRemote(v); persistOrder("people"); }
        state.newPersonName = "";
        render();
      },
      toggleSortMenu: () => { state.sortMenuOpen = !state.sortMenuOpen; render(); },
      selectSort: (el) => {
        const criterion = el.dataset.name;
        if (criterion === "none") {
          state.sortBy = "none";
          state.sortDir = "asc";
        } else {
          state.sortDir = state.sortBy === criterion ? (state.sortDir === "asc" ? "desc" : "asc") : "asc";
          state.sortBy = criterion;
        }
        state.sortMenuOpen = false;
        render();
      },

      openRecipe: (el) => {
        const id = el.dataset.id;
        const r = getRecipe(id);
        state.selectedId = id;
        state.scaleServings = r ? (parseInt(r.servings, 10) || 1) : 1;
        state.editMode = false; state.draft = null;
        render();
      },
      closeRecipe: () => { state.selectedId = null; state.editMode = false; state.draft = null; render(); },
      toggleFavorite: () => {
        const r = getRecipe(state.selectedId);
        if (r) { r.favorite = !r.favorite; saveRecipeRemote(r); }
        render();
      },
      decScale: () => { state.scaleServings = Math.max(1, state.scaleServings - 1); render(); },
      incScale: () => { state.scaleServings = state.scaleServings + 1; render(); },

      openEdit: () => {
        const r = getRecipe(state.selectedId);
        if (!r) return;
        state.editMode = true;
        state.newTagValue = "";
        state.draft = {
          title: r.title, category: r.category, notebookId: r.notebookId, source: r.source || "",
          tags: [...(r.tags || [])], ingredients: [...(r.ingredients || [])], steps: [...(r.steps || [])],
          timeMinutes: parseInt(r.time, 10) || 1, servingsCount: parseInt(r.servings, 10) || 1,
        };
        render();
      },
      cancelEdit: () => { state.editMode = false; state.draft = null; render(); },
      setDraftCategory: (el) => { state.draft.category = el.dataset.name; render(); },
      setDraftNotebook: (el) => { state.draft.notebookId = el.dataset.id || null; render(); },
      toggleDraftTag: (el) => {
        const name = el.dataset.name;
        const t = state.draft.tags;
        state.draft.tags = t.includes(name) ? t.filter((x) => x !== name) : [...t, name];
        render();
      },
      setDraftSource: (el) => { state.draft.source = el.dataset.name === "Ohne Angabe" ? "" : el.dataset.name; render(); },
      addDraftIngredient: () => { state.draft.ingredients.push(""); render(); },
      removeDraftIngredient: (el) => { state.draft.ingredients.splice(Number(el.dataset.index), 1); render(); },
      addDraftStep: () => { state.draft.steps.push(""); render(); },
      removeDraftStep: (el) => { state.draft.steps.splice(Number(el.dataset.index), 1); render(); },
      saveEdit: () => {
        const r = getRecipe(state.selectedId);
        const d = state.draft;
        Object.assign(r, {
          title: d.title.trim() || "Ohne Titel", category: d.category, notebookId: d.notebookId, source: d.source,
          tags: d.tags, ingredients: d.ingredients.filter((v) => v.trim()), steps: d.steps.filter((v) => v.trim()),
          time: (parseInt(d.timeMinutes, 10) || 1) + " Min", servings: (parseInt(d.servingsCount, 10) || 1) + " Portionen",
        });
        saveRecipeRemote(r);
        state.editMode = false; state.draft = null;
        state.scaleServings = parseInt(r.servings, 10) || 1;
        render();
      },

      requestDeleteRecipe: () => { state.pendingDeletion = { type: "recipe", label: "Rezept" }; render(); },
      requestDeletePhoto: () => { state.pendingDeletion = { type: "photo", label: "Foto" }; render(); },
      cancelPendingDeletion: () => { state.pendingDeletion = null; render(); },
      confirmPendingDeletion: () => {
        const d = state.pendingDeletion;
        if (!d) return;
        if (d.type === "recipe") {
          const id = state.selectedId;
          data.recipes = data.recipes.filter((r) => r.id !== id);
          deleteRecipeRemote(id);
          state.editMode = false; state.draft = null; state.selectedId = null;
        } else if (d.type === "photo") {
          const r = getRecipe(state.selectedId);
          if (r) { r.dishPhoto = null; saveRecipeRemote(r); }
        } else if (d.type === "category") {
          data.categories = data.categories.filter((c) => c !== d.name);
          deleteCategoryRemote(d.name);
          persistOrder("categories");
          if (state.categoryFilter === d.name) state.categoryFilter = "Alle";
        } else if (d.type === "notebook") {
          data.notebooks = data.notebooks.filter((n) => n.id !== d.id);
          deleteNotebookRemote(d.id);
          persistOrder("notebooks");
          if (state.notebookFilter === d.id) state.notebookFilter = "all";
        } else if (d.type === "tag") {
          data.tags = data.tags.filter((t) => t !== d.name);
          deleteTagRemote(d.name);
          persistOrder("tags");
          if (state.tagFilter === d.name) state.tagFilter = "Alle";
        } else if (d.type === "person") {
          data.people = data.people.filter((p) => p !== d.name);
          deletePersonRemote(d.name);
          persistOrder("people");
          if (state.personFilter === d.name) state.personFilter = "Alle";
        }
        state.pendingDeletion = null;
        render();
      },

      startCookMode: () => {
        state.cookMode = { recipeId: state.selectedId, stepIndex: 0 };
        if (navigator.wakeLock) {
          navigator.wakeLock.request("screen").then((wl) => { window.__wakeLock = wl; }).catch(() => {});
        }
        render();
      },
      closeCookMode: () => {
        state.cookMode = null;
        if (window.__wakeLock) { window.__wakeLock.release().catch(() => {}); window.__wakeLock = null; }
        render();
      },
      cookNext: () => {
        const r = getRecipe(state.cookMode.recipeId);
        if (!r) return;
        if (state.cookMode.stepIndex >= (r.steps || []).length - 1) { ACTIONS.closeCookMode(); return; }
        state.cookMode.stepIndex++;
        render();
      },
      cookPrev: () => { state.cookMode.stepIndex = Math.max(0, state.cookMode.stepIndex - 1); render(); },

      startDishCapture: () => { dishInput.value = ""; dishInput.click(); },

      openAddChooser: () => { state.addChooserOpen = true; render(); },
      closeAddChooser: () => { state.addChooserOpen = false; render(); },
      chooseCapture: () => { state.addChooserOpen = false; scanInput.value = ""; scanInput.click(); render(); },
      chooseManual: () => {
        state.addChooserOpen = false;
        state.manualAddOpen = true;
        state.manualDraft = { title: "", category: defaultCategory(), notebookId: null, tags: [], source: "", timeMinutes: 30, servingsCount: 2, ingredients: [""], steps: [""] };
        render();
      },
      cancelManualAdd: () => { state.manualAddOpen = false; state.manualDraft = null; render(); },
      setManualCategory: (el) => { state.manualDraft.category = el.dataset.name; render(); },
      setManualNotebook: (el) => { state.manualDraft.notebookId = el.dataset.id || null; render(); },
      toggleManualTag: (el) => {
        const name = el.dataset.name;
        const t = state.manualDraft.tags;
        state.manualDraft.tags = t.includes(name) ? t.filter((x) => x !== name) : [...t, name];
        render();
      },
      setManualSource: (el) => { state.manualDraft.source = el.dataset.name === "Ohne Angabe" ? "" : el.dataset.name; render(); },
      addManualIngredient: () => { state.manualDraft.ingredients.push(""); render(); },
      removeManualIngredient: (el) => { state.manualDraft.ingredients.splice(Number(el.dataset.index), 1); render(); },
      addManualStep: () => { state.manualDraft.steps.push(""); render(); },
      removeManualStep: (el) => { state.manualDraft.steps.splice(Number(el.dataset.index), 1); render(); },
      saveManualAdd: async () => {
        const d = state.manualDraft;
        const recipe = {
          id: uid(), createdAt: Date.now(), title: d.title.trim() || "Neues Rezept", category: d.category, notebookId: d.notebookId,
          time: (parseInt(d.timeMinutes, 10) || 1) + " Min", servings: (parseInt(d.servingsCount, 10) || 1) + " Portionen",
          notes: "", source: d.source, favorite: false, photo: null, dishPhoto: null, tags: d.tags,
          ingredients: d.ingredients.filter((v) => v.trim()), steps: d.steps.filter((v) => v.trim()),
          healthScore: null, healthScoreReason: null, healthScoreExpanded: false, cooked: false,
          stage: "gesammelt",
        };
        data.recipes.unshift(recipe);
        state.manualAddOpen = false; state.manualDraft = null; state.tab = "home";
        render();
        // The stage-set call must wait for the insert to land, otherwise it can race
        // ahead of it and silently update zero rows, leaving the recipe stuck at the
        // column default ("final") instead of "gesammelt".
        await saveRecipeRemote(recipe);
        await setRecipeStageRemote(recipe.id, recipe.stage);
      },

      discardCapture: () => { state.captureStep = null; state.pendingRecipe = null; state.pendingThumb = null; render(); },
      saveCapture: async () => {
        const p = state.pendingRecipe;
        const recipe = {
          // The scanned page photo is only used to read the recipe off it — it is
          // deliberately not stored as the recipe's photo. A dedicated photo of the
          // finished dish is prompted for right after (see dishPrompt below).
          id: uid(), createdAt: Date.now(), title: p.title || "Ohne Titel", category: defaultCategory(), notebookId: null,
          time: p.time || "", servings: p.servings || "", notes: "", source: "", favorite: false,
          photo: null, dishPhoto: null, tags: [],
          ingredients: p.ingredients || [], steps: p.instructions || [],
          healthScore: null, healthScoreReason: null, healthScoreExpanded: false, cooked: false,
          stage: "gesammelt",
        };
        data.recipes.unshift(recipe);
        state.pendingRecipe = null; state.pendingThumb = null;
        state.selectedId = recipe.id;
        state.captureStep = "dishPrompt";
        render();
        // Same ordering reason as saveManualAdd above.
        await saveRecipeRemote(recipe);
        await setRecipeStageRemote(recipe.id, recipe.stage);
      },
      finishCaptureFlow: () => {
        state.captureStep = null; state.selectedId = null; state.tab = "home";
        render();
      },

      shareImage: () => shareImage(),

      computeHealthScore: async () => {
        const r = getRecipe(state.selectedId);
        if (!r || state.healthScoreLoading) return;
        state.healthScoreLoading = true;
        render();
        try {
          const res = await fetch("/.netlify/functions/health-score", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ title: r.title, ingredients: r.ingredients, steps: r.steps }),
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || "Unbekannter Fehler");
          r.healthScore = json.score;
          r.healthScoreReason = json.reason;
          r.healthScoreExpanded = true;
          await saveRecipeRemote(r);
        } catch (err) {
          alert("Health Score konnte nicht berechnet werden: " + err.message);
        }
        state.healthScoreLoading = false;
        render();
      },
      toggleHealthScore: () => {
        const r = getRecipe(state.selectedId);
        if (r) { r.healthScoreExpanded = !r.healthScoreExpanded; saveRecipeRemote(r); }
        render();
      },
      healthScoreCellAction: () => {
        const r = getRecipe(state.selectedId);
        if (!r) return;
        if (r.healthScore == null) ACTIONS.computeHealthScore();
        else ACTIONS.toggleHealthScore();
      },

      cancelCrop: () => {
        if (state.cropStep) URL.revokeObjectURL(state.cropStep.fileUrl);
        state.cropStep = null;
        render();
      },
      confirmCrop: () => {
        const c = state.cropStep;
        const OUT_W = 640, OUT_H = 480;
        const canvas = document.createElement("canvas");
        canvas.width = OUT_W; canvas.height = OUT_H;
        const ctx = canvas.getContext("2d");
        const img = new Image();
        img.onload = () => {
          const scale = c.baseScale * c.zoom;
          const sx = -c.offsetX / scale;
          const sy = -c.offsetY / scale;
          const sW = c.frameW / scale, sH = c.frameH / scale;
          ctx.drawImage(img, sx, sy, sW, sH, 0, 0, OUT_W, OUT_H);
          finishDishPhoto(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = c.fileUrl;
      },
    };

    // ---------- Real capture flow ----------
    scanInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      state.captureStep = "processing";
      render();
      try {
        const [apiImg, thumb] = await Promise.all([
          resizeImage(file, 1600, 0.82),
          resizeImage(file, 640, 0.7),
        ]);
        const res = await fetch("/.netlify/functions/extract-recipe", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ image: apiImg.base64, mediaType: apiImg.mediaType }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "Unbekannter Fehler");
        state.pendingRecipe = json;
        state.pendingThumb = thumb.dataUrl;
        state.captureStep = "result";
      } catch (err) {
        state.captureError = err.message;
        state.captureStep = "error";
      }
      render();
    });

    dishInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const frameW = 280, frameH = 210;
        const baseScale = Math.max(frameW / img.naturalWidth, frameH / img.naturalHeight);
        const w = img.naturalWidth * baseScale, h = img.naturalHeight * baseScale;
        state.cropStep = {
          fileUrl: url, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight,
          baseScale, zoom: 1, frameW, frameH,
          offsetX: Math.min(0, (frameW - w) / 2),
          offsetY: Math.min(0, (frameH - h) / 2),
        };
        render();
      };
      img.onerror = () => { URL.revokeObjectURL(url); };
      img.src = url;
    });

    function clampCropOffset(c) {
      const w = c.naturalWidth * c.baseScale * c.zoom;
      const h = c.naturalHeight * c.baseScale * c.zoom;
      c.offsetX = Math.min(0, Math.max(c.frameW - w, c.offsetX));
      c.offsetY = Math.min(0, Math.max(c.frameH - h, c.offsetY));
    }

    async function finishDishPhoto(dataUrl) {
      if (state.cropStep) URL.revokeObjectURL(state.cropStep.fileUrl);
      state.cropStep = null;
      const r = getRecipe(state.selectedId);
      if (r) {
        r.dishPhoto = dataUrl;
        await saveRecipeRemote(r);
      }
      if (state.captureStep === "dishPrompt") {
        state.captureStep = null;
        state.selectedId = null;
        state.tab = "home";
      }
      render();
    }

    // ---------- Share as image ----------
    function layoutRecipeImage(ctx, r, W, photoH, draw) {
      let y = photoH + 30;

      ctx.font = "600 22px -apple-system, system-ui, sans-serif";
      const catText = r.category || "Ohne Kategorie";
      const catW = ctx.measureText(catText).width + 32;
      if (draw) {
        ctx.fillStyle = "oklch(0.89 0.07 75)";
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(40, y, catW, 46, 23); else ctx.rect(40, y, catW, 46);
        ctx.fill();
        ctx.fillStyle = "oklch(0.42 0.13 65)";
        ctx.fillText(catText, 56, y + 31);
      }
      y += 46;

      const tags = r.tags || [];
      if (tags.length) {
        y += 22;
        ctx.font = "600 18px -apple-system, system-ui, sans-serif";
        let x = 40;
        const tagH = 34;
        tags.forEach((tag) => {
          const tw = ctx.measureText(tag).width + 28;
          if (x > 40 && x + tw > W - 40) { x = 40; y += tagH + 10; }
          if (draw) {
            ctx.fillStyle = "oklch(0.94 0.01 75)";
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, tw, tagH, 17); else ctx.rect(x, y, tw, tagH);
            ctx.fill();
            ctx.fillStyle = "oklch(0.4 0.01 75)";
            ctx.fillText(tag, x + 14, y + 23);
          }
          x += tw + 10;
        });
        y += tagH;
      }
      y += 36;

      ctx.fillStyle = "#2b2822";
      ctx.font = "700 42px -apple-system, system-ui, sans-serif";
      y = wrapText(ctx, r.title, 40, y, W - 80, 50, draw);

      y += 34;
      const servingsNumber = parseInt(r.servings, 10) || r.servings || "—";
      const stats = [
        { value: r.time || "—", label: "Kochzeit" },
        { value: String(servingsNumber), label: "Portionen" },
        { value: r.source || "—", label: "Von wem" },
      ];
      const boxH = 112;
      if (draw) {
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "oklch(0.85 0.01 75)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(40, y, W - 80, boxH, 20); else ctx.rect(40, y, W - 80, boxH);
        ctx.fill();
        ctx.stroke();
        const colW = (W - 80) / 3;
        stats.forEach((s, i) => {
          const cx = 40 + colW * i + colW / 2;
          ctx.textAlign = "center";
          ctx.font = "700 24px -apple-system, system-ui, sans-serif";
          ctx.fillStyle = "#2b2822";
          ctx.fillText(s.value, cx, y + 50);
          ctx.font = "18px -apple-system, system-ui, sans-serif";
          ctx.fillStyle = "oklch(0.4 0.01 75)";
          ctx.fillText(s.label, cx, y + 80);
          ctx.textAlign = "left";
          if (i > 0) {
            ctx.beginPath();
            ctx.moveTo(40 + colW * i, y + 28);
            ctx.lineTo(40 + colW * i, y + boxH - 28);
            ctx.stroke();
          }
        });
      }
      y += boxH + 46;

      ctx.font = "700 26px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "#2b2822";
      if (draw) ctx.fillText("Zutaten", 40, y);
      y += 14;
      ctx.font = "20px -apple-system, system-ui, sans-serif";
      (r.ingredients || []).forEach((ing) => {
        y += 36;
        if (draw) {
          ctx.fillStyle = "oklch(0.55 0.13 70)";
          ctx.beginPath(); ctx.arc(46, y - 7, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#3a3730";
        }
        y = wrapText(ctx, ing, 62, y, W - 100, 28, draw) - 28;
      });
      y += 46;

      ctx.font = "700 26px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "#2b2822";
      if (draw) ctx.fillText("Zubereitung", 40, y);
      y += 14;
      (r.steps || []).forEach((step, i) => {
        y += 36;
        ctx.font = "700 18px -apple-system, system-ui, sans-serif";
        if (draw) {
          ctx.fillStyle = "oklch(0.89 0.07 75)";
          ctx.beginPath(); ctx.arc(50, y - 8, 15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "oklch(0.42 0.13 65)";
          ctx.textAlign = "center";
          ctx.fillText(String(i + 1), 50, y - 2);
          ctx.textAlign = "left";
        }
        ctx.font = "20px -apple-system, system-ui, sans-serif";
        ctx.fillStyle = "#3a3730";
        y = wrapText(ctx, step, 76, y, W - 116, 28, draw) - 28;
        y += 36;
      });

      if (r.notes && r.notes.trim()) {
        y += 20;
        ctx.font = "700 26px -apple-system, system-ui, sans-serif";
        ctx.fillStyle = "#2b2822";
        if (draw) ctx.fillText("Notizen", 40, y);
        y += 40;
        ctx.font = "20px -apple-system, system-ui, sans-serif";
        ctx.fillStyle = "#3a3730";
        y = wrapText(ctx, r.notes, 40, y, W - 80, 28, draw);
      }

      return y + 40;
    }

    function shareImage() {
      const r = getRecipe(state.selectedId);
      if (!r) return;
      const W = 800;
      const photoH = Math.round(W * 230 / 390); // matches the phone's .detailHero aspect ratio (230px at ~390px width)

      const measureCanvas = document.createElement("canvas");
      const mctx = measureCanvas.getContext("2d");
      const totalH = Math.ceil(layoutRecipeImage(mctx, r, W, photoH, false));

      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = totalH;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f5f0e6";
      ctx.fillRect(0, 0, W, totalH);

      function finish() {
        layoutRecipeImage(ctx, r, W, photoH, true);
        canvas.toBlob((blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const filename = (r.title || "rezept").replace(/[^a-z0-9äöüß -]/gi, "").trim() + ".png";
          if (navigator.share && navigator.canShare) {
            const file = new File([blob], filename, { type: "image/png" });
            if (navigator.canShare({ files: [file] })) {
              navigator.share({ files: [file], title: r.title }).catch(() => {});
              setTimeout(() => URL.revokeObjectURL(url), 3000);
              return;
            }
          }
          const a = document.createElement("a");
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 3000);
        }, "image/png");
      }

      const shareImg = r.dishPhoto || r.photo;
      if (shareImg) {
        const img = new Image();
        img.onload = () => {
          const scale = Math.max(W / img.width, photoH / img.height);
          const dw = img.width * scale, dh = img.height * scale;
          ctx.drawImage(img, (W - dw) / 2, (photoH - dh) / 2, dw, dh);
          finish();
        };
        img.onerror = finish;
        img.src = shareImg;
      } else {
        const idx = Math.abs(hashStr(r.id)) % COLOR_PAIRS.length;
        const grad = ctx.createLinearGradient(0, 0, W, photoH);
        grad.addColorStop(0, "#c98a5a"); grad.addColorStop(1, "#e0b183");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, photoH);
        finish();
      }
    }

    // ---------- Auth / bootstrap ----------
    function renderLoading() {
      app.innerHTML = `<div class="lockScreen"><div class="spinner"></div></div>`;
    }

    function renderLock(errorMsg) {
      app.innerHTML = `
        <div class="lockScreen">
          <div class="lockTitle">🔒 Rezept-Scanner</div>
          <input id="lockInput" type="password" class="textInput" placeholder="Passwort" autocomplete="current-password" />
          ${errorMsg ? `<div class="lockError">${escapeHtml(errorMsg)}</div>` : ""}
          <button class="btnPrimary" id="lockBtn">Entsperren</button>
        </div>`;
      const input = document.getElementById("lockInput");
      const btn = document.getElementById("lockBtn");
      const submit = () => { const v = input.value.trim(); if (v) tryUnlock(v); };
      btn.addEventListener("click", submit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      input.focus();
    }

    async function tryUnlock(pw) {
      renderLoading();
      try {
        const loaded = await loadAllData(pw);
        appPassword = pw;
        localStorage.setItem(AUTH_KEY, pw);
        Object.assign(data, loaded);
        render();
      } catch (err) {
        const msg = /invalid password/i.test(err.message || "")
          ? "Falsches Passwort."
          : "Verbindung fehlgeschlagen. Prüfe deine Internetverbindung.";
        renderLock(msg);
      }
    }

    if (appPassword) {
      renderLoading();
      tryUnlock(appPassword);
    } else {
      renderLock();
    }
  </script>
