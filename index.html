<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hello World Test</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 { font-size: 2.5rem; margin: 0; }
    p { margin: 0; opacity: 0.7; }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }
    #mode {
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <span id="mode">wird geladen…</span>
  <h1>Hello World 👋</h1>
  <p>Diese Seite läuft über GitHub Pages, geöffnet in Safari auf dem iPhone.</p>
  <button id="btn">Getippt: <span id="count">0</span></button>
  <p id="time"></p>

  <script>
    const isStandalone = window.navigator.standalone === true;
    document.getElementById("mode").textContent = isStandalone
      ? "läuft als App (Home-Bildschirm)"
      : "läuft im Safari-Tab";

    let count = 0;
    document.getElementById("btn").addEventListener("click", () => {
      count++;
      document.getElementById("count").textContent = count;
    });

    document.getElementById("time").textContent = "Geladen um " + new Date().toLocaleTimeString("de-DE");
  </script>
</body>
</html>
