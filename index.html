<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rezept-Scanner</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    h1 { font-size: 1.6rem; margin: 0.5rem 0 0; text-align: center; }
    .sub { text-align: center; opacity: 0.65; margin: 0; font-size: 0.9rem; }

    #scanBtn {
      padding: 0.9rem 1.5rem;
      font-size: 1.05rem;
      border: none;
      border-radius: 999px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
    }
    #scanBtn:active { opacity: 0.85; }

    #status {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
      min-height: 1.2em;
    }

    #preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
    }

    .card {
      background: #fdf6e3;
      color: #2d2a24;
      border-radius: 16px;
      padding: 1.5rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      font-family: Georgia, "Times New Roman", serif;
    }
    .card h2 {
      margin: 0 0 0.25rem;
      font-size: 1.4rem;
      border-bottom: 2px solid #d9c9a3;
      padding-bottom: 0.5rem;
    }
    .card .meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      opacity: 0.75;
      margin: 0.5rem 0 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card h3 {
      font-size: 1rem;
      margin: 1rem 0 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card ul, .card ol { margin: 0; padding-left: 1.2rem; }
    .card li { margin-bottom: 0.4rem; line-height: 1.4; }

    .cardActions {
      display: flex;
      gap: 0.75rem;
    }
    .cardActions button {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
    }
    #saveBtn { background: #22c55e; color: #052e12; }
    #discardBtn { background: rgba(255,255,255,0.12); color: #f8fafc; }

    #collection {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    #collection h2 { font-size: 1.1rem; margin: 0; opacity: 0.85; }
    .collectionItem {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .collectionItem .title { font-weight: 600; }
    .collectionItem .meta2 { font-size: 0.8rem; opacity: 0.6; }
    .collectionItem button {
      border: none;
      background: transparent;
      color: #f87171;
      font-size: 1.1rem;
      padding: 0.3rem 0.5rem;
    }
    .collectionItem .open { color: #38bdf8; background: transparent; border: none; font-size: 0.85rem; font-weight: 600; }

    #emptyHint { text-align: center; opacity: 0.5; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>📷 Rezept-Scanner</h1>
    <p class="sub">Kochbuchseite fotografieren, automatisch als Kärtchen speichern.</p>

    <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none" />
    <button id="scanBtn">Rezept fotografieren</button>
    <p id="status"></p>
    <img id="preview" alt="Aufgenommenes Foto" />

    <div id="result"></div>

    <div id="collection">
      <h2>Meine Sammlung</h2>
      <div id="collectionList"></div>
      <p id="emptyHint">Noch keine Rezepte gespeichert.</p>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const scanBtn = document.getElementById("scanBtn");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");
    const resultEl = document.getElementById("result");
    const collectionList = document.getElementById("collectionList");
    const emptyHint = document.getElementById("emptyHint");

    const STORAGE_KEY = "recipeCollection";
    let currentRecipe = null;

    scanBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", onFileSelected);

    async function onFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      resultEl.innerHTML = "";
      statusEl.textContent = "Foto wird verkleinert…";

      try {
        const { base64, mediaType, dataUrl } = await resizeImage(file, 1600, 0.82);
        preview.src = dataUrl;
        preview.style.display = "block";

        statusEl.textContent = "Rezept wird gelesen… (kann ein paar Sekunden dauern)";

        const res = await fetch("/.netlify/functions/extract-recipe", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ image: base64, mediaType }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Unbekannter Fehler");
        }

        currentRecipe = data;
        statusEl.textContent = "";
        renderCard(data, true);
      } catch (err) {
        statusEl.textContent = "Fehler: " + err.message;
      } finally {
        fileInput.value = "";
      }
    }

    function resizeImage(file, maxDim, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve({ base64: dataUrl.split(",")[1], mediaType: "image/jpeg", dataUrl });
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderCard(recipe, withActions) {
      const ingredients = (recipe.ingredients || []).map((i) => `<li>${escapeHtml(i)}</li>`).join("");
      const steps = (recipe.instructions || []).map((s) => `<li>${escapeHtml(s)}</li>`).join("");
      const meta = [recipe.servings, recipe.time].filter(Boolean).map(escapeHtml).join(" · ");

      resultEl.innerHTML = `
        <div class="card">
          <h2>${escapeHtml(recipe.title || "Ohne Titel")}</h2>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
          ${ingredients ? `<h3>Zutaten</h3><ul>${ingredients}</ul>` : ""}
          ${steps ? `<h3>Zubereitung</h3><ol>${steps}</ol>` : ""}
        </div>
        ${withActions ? `
          <div class="cardActions">
            <button id="saveBtn">Speichern</button>
            <button id="discardBtn">Verwerfen</button>
          </div>` : ""}
      `;

      if (withActions) {
        document.getElementById("saveBtn").addEventListener("click", saveCurrentRecipe);
        document.getElementById("discardBtn").addEventListener("click", () => {
          resultEl.innerHTML = "";
          preview.style.display = "none";
          currentRecipe = null;
        });
      }
    }

    function saveCurrentRecipe() {
      if (!currentRecipe) return;
      const list = loadCollection();
      list.unshift({ ...currentRecipe, savedAt: new Date().toISOString() });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      resultEl.innerHTML = "";
      preview.style.display = "none";
      currentRecipe = null;
      renderCollection();
    }

    function loadCollection() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function renderCollection() {
      const list = loadCollection();
      emptyHint.style.display = list.length ? "none" : "block";
      collectionList.innerHTML = list.map((r, i) => `
        <div class="collectionItem">
          <div>
            <div class="title">${escapeHtml(r.title || "Ohne Titel")}</div>
            <div class="meta2">${[r.servings, r.time].filter(Boolean).map(escapeHtml).join(" · ")}</div>
          </div>
          <button class="open" data-index="${i}">Öffnen</button>
          <button data-delete="${i}" aria-label="Löschen">✕</button>
        </div>
      `).join("");

      collectionList.querySelectorAll("[data-index]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const r = loadCollection()[Number(btn.dataset.index)];
          renderCard(r, false);
          preview.style.display = "none";
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
      collectionList.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const list = loadCollection();
          list.splice(Number(btn.dataset.delete), 1);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          renderCollection();
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    renderCollection();
  </script>
</body>
</html>
